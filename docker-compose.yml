services:
  # -------------------------
  # PostgreSQL (в контейнере)
  # -------------------------
  db:
    image: postgres:16-alpine
    env_file:
      - .env.docker
    environment:
      # postgres image использует только эти 3 переменные
      POSTGRES_DB: ${POSTGRES_DB:-procurement_db}
      POSTGRES_USER: ${POSTGRES_USER:-procurement_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-procurement_password-132345}

    # ВАЖНО:
    # - 5432 на хосте у тебя занят локальным Postgres
    # - поэтому наружу пробрасываем на 5433
    ports:
      - "5433:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

    restart: unless-stopped

  # -------------------------
  # Redis (в контейнере)
  # -------------------------
  redis:
    image: redis:7-alpine

    # ВАЖНО:
    # - 6379 на хосте у тебя занят локальным redis
    # - поэтому наружу пробрасываем на 6380
    # - ВНУТРИ docker-сети Redis всё равно слушает 6379
    ports:
      - "6380:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

    restart: unless-stopped

  # -------------------------
  # Django (dev-сервер)
  # -------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.docker
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      PYTHONPATH: /app

      # ВНУТРИ сети docker нужно ходить на сервисы по имени контейнера
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"

      # Celery
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1

      # Stage 9.6: ORM/Cache
      # redis DB:2 — отдельная база под кэш (0/1 заняты брокером/результатами)
      REDIS_CACHE_URL: redis://redis:6379/2
      # Удобно для сравнения "до/после" (можно выключать без правок кода)
      CACHALOT_ENABLED: "1"

    volumes:
      - .:/app

    # ВАЖНО:
    # - 8000 на хосте у тебя занят локальным Django
    # - поэтому наружу пробрасываем на 8001
    ports:
      - "8001:8000"

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    # health endpoint: GET /
    # curl уже есть у тебя в Dockerfile
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

    command: >
      bash -c "
        python manage.py migrate &&
        python manage.py runserver 0.0.0.0:8000
      "

    restart: unless-stopped

  # -------------------------
  # Celery worker (профиль celery)
  # -------------------------
  celery_worker:
    profiles: ["celery"]
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.docker
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      PYTHONPATH: /app

      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"

      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1

      # Stage 9.6
      REDIS_CACHE_URL: redis://redis:6379/2
      CACHALOT_ENABLED: "1"

    volumes:
      - .:/app

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    command: celery -A config worker -l info
    restart: unless-stopped

  # -------------------------
  # Celery beat (профиль celery)
  # -------------------------
  celery_beat:
    profiles: ["celery"]
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.docker
    environment:
      DJANGO_SETTINGS_MODULE: config.settings
      PYTHONPATH: /app

      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"

      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1

      # Stage 9.6
      REDIS_CACHE_URL: redis://redis:6379/2
      CACHALOT_ENABLED: "1"

    volumes:
      - .:/app

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    command: celery -A config beat -l info
    restart: unless-stopped

  # -------------------------
  # Flower (мониторинг Celery) (профиль monitoring)
  # -------------------------
  flower:
    profiles: ["monitoring"]
    image: mher/flower:2.0

    # В этом образе дефолтный entrypoint запускает `python -m flower ...`,
    # из-за чего `--port` не распознаётся.
    # Поэтому переопределяем entrypoint на `celery` и запускаем Flower через celery-subcommand.
    entrypoint: ["celery"]
    command:
      - "--broker=redis://redis:6379/0"
      - "flower"
      - "--address=0.0.0.0"
      - "--port=5555"

    # Чтобы избежать коллизий — оставляем 5556 (как у тебя)
    ports:
      - "5556:5555"

    depends_on:
      redis:
        condition: service_healthy

    restart: unless-stopped

  # -------------------------
  # Тесты внутри compose-сети (профиль test)
  # -------------------------
  tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.docker
    environment:
      DJANGO_SETTINGS_MODULE: config.settings_test_pg
      PYTHONPATH: /app

      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"

      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1

      # Stage 9.6 (в тестах можно оставить включённым, но если вдруг начнут флапать
      # из-за кэша — просто поставь "0")
      REDIS_CACHE_URL: redis://redis:6379/2
      CACHALOT_ENABLED: "0"

    volumes:
      - .:/app

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    command: pytest -q

volumes:
  pgdata: